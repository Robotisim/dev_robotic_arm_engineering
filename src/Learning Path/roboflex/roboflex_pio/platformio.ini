; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = prod

[env:prod]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit PWM Servo Driver Library@^3.0.2
build_flags =
  -D ROBOFLEX_WIFI_SSID=\"Connect\"
  -D ROBOFLEX_WIFI_PASSWORD=\"123456789\"
  -D ROBOFLEX_UDP_LISTEN_PORT=9999
  -D ROBOFLEX_PCA9685_ADDR=0x40
build_src_filter =
  +<*>
  -<main_dev.cpp>
  -<main_bench.cpp>

[env:dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit PWM Servo Driver Library@^3.0.2
build_src_filter =
  +<*>
  -<main.cpp>
  -<main_bench.cpp>

[env:esp32doit-devkit-v1]
extends = env:prod

; Serial-only, explicitly commanded test for arm ch 1..4 and gripper ch 5.
; Flash with motor power off; all PWM outputs are disabled during setup.
[env:bench]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2
build_src_filter =
  -<*>
  +<main_bench.cpp>
